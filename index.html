<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jax Games 47 | Next-Gen</title>
    <style>
        :root {
            --bg-main: #140504;
            --bg-surface: #220a08;
            --bg-card: #2e0e0b;
            --neon-accent: #FF0800;
            --text-main: #ffebee;
            --text-muted: rgba(255, 235, 238, 0.6);
            --border-color: #540400;
            --ultra-timing: cubic-bezier(0.25, 1, 0.3, 1);
        }

        [data-theme="midnight"] {
            --bg-main: #0B0F19;
            --bg-surface: #111827;
            --bg-card: #1F2937;
            --neon-accent: #3B82F6;
            --text-main: #F3F4F6;
            --text-muted: rgba(243, 244, 246, 0.6);
            --border-color: #1E3A8A;
        }

        [data-theme="cyber"] {
            --bg-main: #0A0A0C;
            --bg-surface: #121216;
            --bg-card: #1A1A22;
            --neon-accent: #00FFCC;
            --text-main: #E2E8F0;
            --text-muted: rgba(226, 232, 240, 0.6);
            --border-color: #004D40;
        }

        [data-theme="emerald"] {
            --bg-main: #061A14;
            --bg-surface: #0B2920;
            --bg-card: #12382C;
            --neon-accent: #10B981;
            --text-main: #ECFDF5;
            --text-muted: rgba(236, 253, 245, 0.6);
            --border-color: #047857;
        }

        [data-theme="sunset"] {
            --bg-main: #1A0C18;
            --bg-surface: #291225;
            --bg-card: #381A33;
            --neon-accent: #F43F5E;
            --text-main: #FFF1F2;
            --text-muted: rgba(255, 241, 242, 0.6);
            --border-color: #BE123C;
        }

        [data-theme="amethyst"] {
            --bg-main: #120A21;
            --bg-surface: #1C1033;
            --bg-card: #271747;
            --neon-accent: #A855F7;
            --text-main: #FAF5FF;
            --text-muted: rgba(250, 245, 255, 0.6);
            --border-color: #6B21A8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .page-wrapper {
            width: 100%;
            min-height: 100vh;
        }

        /* Compact Header Controls Toolbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            max-width: 1400px;
            margin: 0 auto;
            flex-wrap: wrap;
            gap: 15px;
            background: var(--bg-surface);
            border-bottom: 2px solid var(--border-color);
            border-radius: 0 0 16px 16px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            user-select: none;
        }

        .jax { color: #ffffff; }
        .games-cyan { 
            color: var(--neon-accent); 
            text-shadow: 0 0 10px var(--neon-accent);
        }

        .action-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mini-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .mini-btn:hover {
            border-color: var(--neon-accent);
            box-shadow: 0 0 8px var(--neon-accent);
            transform: translateY(-1px);
        }

        select.mini-btn {
            appearance: none;
            padding-right: 20px;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 6px center;
            background-size: 12px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 25px 20px 50px 20px;
            text-align: center;
        }

        .top-shelf {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
        }

        h1.section-title {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            margin: 0;
        }

        .search-container {
            width: 100%;
            max-width: 300px;
        }

        .search-bar {
            width: 100%;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 20px;
            border: 2px solid var(--border-color);
            background-color: var(--bg-surface);
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-bar::placeholder {
            color: var(--text-muted);
        }

        .search-bar:focus {
            border-color: var(--neon-accent);
            box-shadow: 0 0 10px var(--neon-accent);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            justify-items: center;
        }

        .game-link {
            text-decoration: none;
            display: block;
            width: 100%;
            position: relative;
        }

        .game-button {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .game-button img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .favorite-heart-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .favorite-heart-btn.is-active {
            color: #ff3366;
            border-color: #ff3366;
        }

        .game-link:hover .game-button {
            border-color: var(--neon-accent);
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.5), 0 0 12px var(--neon-accent);
        }

        .game-link:hover .game-button img {
            transform: scale(1.05);
        }

        .game-link.is-hidden {
            display: none !important;
        }

        .social-dashboard-section {
            max-width: 900px;
            margin: 40px auto 0 auto;
            background: var(--bg-surface);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
        }

        .dashboard-tabs {
            display: flex;
            background: var(--bg-card);
            border-bottom: 2px solid var(--border-color);
        }

        .dashboard-tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dashboard-tab-btn.active {
            color: var(--neon-accent);
            background: var(--bg-surface);
            box-shadow: inset 0 -3px 0 var(--neon-accent);
        }

        .dashboard-tab-content {
            padding: 20px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
        }

        .friends-layout {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .social-search-bar {
            display: flex;
            gap: 8px;
            max-width: 500px;
            margin: 0 auto 10px auto;
            width: 100%;
        }

        .social-search-bar input {
            flex: 1;
            padding: 8px 12px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 0.85rem;
        }

        .friends-flex-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .friend-dashboard-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .friend-name-tag {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .friend-status-activity {
            font-size: 0.8rem;
            color: var(--neon-accent);
        }

        .chat-pane-layout {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            height: 280px;
        }

        .chat-history-box {
            flex-grow: 1;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            overflow-y: auto;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .chat-message-bubble {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
        }

        .chat-message-bubble.incoming {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            align-self: flex-start;
        }

        .chat-message-bubble.outgoing {
            background: var(--neon-accent);
            color: #fff;
            align-self: flex-end;
        }

        .chat-meta-header {
            font-size: 0.7rem;
            font-weight: 800;
            display: block;
            margin-bottom: 2px;
            opacity: 0.8;
        }

        .chat-input-bar {
            display: flex;
            gap: 8px;
        }

        .chat-input-bar input {
            flex: 1;
            padding: 8px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 0.85rem;
        }

        .horror-overlay, .auth-overlay, .name-setup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        .modal-box {
            width: 320px;
            background: var(--bg-surface);
            border: 2px solid var(--neon-accent);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
        }

        .pinpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 10px;
        }

        #pinInput {
            width: 100%;
            padding: 8px;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 8px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
        }
    </style>
</head>

                <div class="game-grid" style="grid-template-columns: repeat(2, 1fr);">
                    <a href="https://jaxgames47.github.io/granny/" class="game-link"><div class="game-button"><img src="Granny.png"></div></a>
                    <a href="https://jaxgames47.github.io/thebackrooms/" class="game-link"><div class="game-button"><img src="backrooms.png"></div></a>
                </div>
                <button class="mini-btn" style="margin-top:12px;" onclick="closeHorror()">Close</button>
            </div>
        </div>
    </div>

    <div class="auth-overlay" id="authOverlay">
        <div class="modal-box">
            <div style="text-align: right; margin-bottom: 5px;"><span style="cursor:pointer;" onclick="closeAuthSystem()">✕</span></div>
            <h3 id="authTitle" style="margin-bottom:12px;">Sign In</h3>
            <input type="email" id="authEmail" class="search-bar" style="margin-bottom:8px; border-radius:8px;" placeholder="Email Address">
            <input type="password" id="authPassword" class="search-bar" style="margin-bottom:8px; border-radius:8px;" placeholder="Password">
            <button class="mini-btn" style="width:100%; padding:8px;" id="authSubmitBtn" onclick="submitAuthData()">Submit</button>
        </div>
    </div>

    <div class="name-setup-overlay" id="nameSetupOverlay">
        <div class="modal-box">
            <h3>Choose Display Name</h3>
            <p style="color:var(--text-muted); font-size:0.8rem; margin: 8px 0 12px 0;">Set your public tag for chat & friends.</p>
            <input type="text" id="displayNameInput" class="search-bar" style="margin-bottom:8px; border-radius:8px;" placeholder="Gamertag...">
            <button class="mini-btn" style="width:100%; padding:8px;" onclick="saveDisplayName()">Save Tag</button>
        </div>
    </div>

    <script>
        const themeSelect = document.getElementById('themeSelect');
        themeSelect.addEventListener('change', (e) => {
            const theme = e.target.value;
            if (theme === 'crimson') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
        });

        const gameSearch = document.getElementById('gameSearch');
        const gameLinks = document.querySelectorAll('.game-grid .game-link');

        gameSearch.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            gameLinks.forEach(link => {
                const title = link.getAttribute('data-title') || '';
                const altText = link.querySelector('img')?.alt.toLowerCase() || '';
                if (title.toLowerCase().includes(query) || altText.includes(query)) {
                    link.classList.remove('is-hidden');
                } else {
                    link.classList.add('is-hidden');
                }
            });
        });

        let favorites = JSON.parse(localStorage.getItem('jax_favorites') || '[]');
        gameLinks.forEach((link, index) => {
            const heartBtn = document.createElement('button');
            heartBtn.className = 'favorite-heart-btn';
            heartBtn.innerHTML = '♥';
            if (favorites.includes(index)) {
                heartBtn.classList.add('is-active');
            }

            heartBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (favorites.includes(index)) {
                    favorites = favorites.filter(i => i !== index);
                    heartBtn.classList.remove('is-active');
                } else {
                    favorites.push(index);
                    heartBtn.classList.add('is-active');
                }
                localStorage.setItem('jax_favorites', JSON.stringify(favorites));
            });

            link.appendChild(heartBtn);
        });

        const horrorBtn = document.getElementById('horrorBtn');
        const horrorOverlay = document.getElementById('horrorOverlay');
        const pinInput = document.getElementById('pinInput');
        const pinSection = document.getElementById('pinSection');
        const horrorGames = document.getElementById('horrorGames');
        const CORRECT_PIN = "1234";

        horrorBtn.addEventListener('click', () => {
            horrorOverlay.style.display = 'flex';
        });

        function pinPress(num) {
            if (pinInput.value.length < 4) {
                pinInput.value += num;
            }
            if (pinInput.value === CORRECT_PIN) {
                pinSection.style.display = 'none';
                horrorGames.style.display = 'block';
            } else if (pinInput.value.length === 4) {
                setTimeout(() => {
                    alert('Incorrect PIN!');
                    clearPin();
                }, 100);
            }
        }

        function clearPin() {
            pinInput.value = '';
        }

        function closeHorror() {
            horrorOverlay.style.display = 'none';
            clearPin();
            pinSection.style.display = 'block';
            horrorGames.style.display = 'none';
        }

        const authOverlay = document.getElementById('authOverlay');
        const nameSetupOverlay = document.getElementById('nameSetupOverlay');
        let currentUser = localStorage.getItem('jax_user') || null;

        function updateAuthHeader() {
            const authHeaderBtn = document.getElementById('authHeaderBtn');
            if (currentUser) {
                authHeaderBtn.textContent = `${currentUser} 👤`;
            } else {
                authHeaderBtn.textContent = 'Sign In 👤';
            }
        }
        updateAuthHeader();

        function openAuthSystem() {
            authOverlay.style.display = 'flex';
        }

        function closeAuthSystem() {
            authOverlay.style.display = 'none';
        }

        function submitAuthData() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;

            if (!email || !password) {
                alert('Please enter both email and password.');
                return;
            }

            closeAuthSystem();
            nameSetupOverlay.style.display = 'flex';
        }

        function saveDisplayName() {
            const nameInput = document.getElementById('displayNameInput').value.trim();
            if (nameInput) {
                currentUser = nameInput;
                localStorage.setItem('jax_user', currentUser);
                updateAuthHeader();
                nameSetupOverlay.style.display = 'none';
                renderFriendsList();
            } else {
                alert('Please enter a valid display name.');
            }
        }

        let friends = JSON.parse(localStorage.getItem('jax_friends') || '["GamerTag99", "PixelNinja"]');
        let messages = [
            { sender: 'System', text: 'Welcome to Jax Games Live Chat!' }
        ];

        function toggleDashboardTab(tab) {
            const friendsTab = document.getElementById('dashFriendsTabHead');
            const chatTab = document.getElementById('dashChatTabHead');
            const friendsPane = document.getElementById('dashFriendsPane');
            const chatPane = document.getElementById('dashChatPane');

            if (tab === 'friends') {
                friendsTab.classList.add('active');
                chatTab.classList.remove('active');
                friendsPane.style.display = 'flex';
                chatPane.style.display = 'none';
            } else {
                chatTab.classList.add('active');
                friendsTab.classList.remove('active');
                chatPane.style.display = 'flex';
                friendsPane.style.display = 'none';
                renderChatWindow();
            }
        }

        function renderFriendsList() {
            const box = document.getElementById('dashboardFriendsRenderBox');
            box.innerHTML = '';
            
            if (friends.length === 0) {
                box.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">No friends added yet.</p>';
                return;
            }

            friends.forEach(name => {
                const card = document.createElement('div');
                card.className = 'friend-dashboard-card';
                card.innerHTML = `
                    <div>
                        <span class="friend-name-tag">${name}</span>
                        <div class="friend-status-activity">Online</div>
                    </div>
                    <button class="mini-btn" onclick="toggleDashboardTab('chat')">Message</button>
                `;
                box.appendChild(card);
            });
        }
        renderFriendsList();

        function handleAddFriendSubmit() {
            const input = document.getElementById('addFriendUsernameInput');
            const target = input.value.trim();
            if (target && !friends.includes(target)) {
                friends.push(target);
                localStorage.setItem('jax_friends', JSON.stringify(friends));
                input.value = '';
                renderFriendsList();
            }
        }

        function renderChatWindow() {
            const chatArea = document.getElementById('chatActiveWindowArea');
            chatArea.innerHTML = `
                <div class="chat-history-box" id="chatHistoryBox"></div>
                <div class="chat-input-bar">
                    <input type="text" id="chatMessageInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChatMessage()">
                    <button class="mini-btn" onclick="sendChatMessage()">Send</button>
                </div>
            `;

            const historyBox = document.getElementById('chatHistoryBox');
            messages.forEach(msg => {
                const isUser = msg.sender === (currentUser || 'You');
                const bubble = document.createElement('div');
                bubble.className = `chat-message-bubble ${isUser ? 'outgoing' : 'incoming'}`;
                bubble.innerHTML = `<span class="chat-meta-header">${msg.sender}</span>${msg.text}`;
                historyBox.appendChild(bubble);
            });
            historyBox.scrollTop = historyBox.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('chatMessageInput');
            const text = input.value.trim();
            if (text) {
                messages.push({ sender: currentUser || 'You', text: text });
                input.value = '';
                renderChatWindow();
            }
        }
    </script>
</body>
</html>
