<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Portal</title>
    <style>
        /* --- Keeping Your Original Styles & Colors Exactly --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #1a1a2e, #0f0f1b);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* --- Your 3 Sections Layout at the Top --- */
        .sections-wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 40px;
        }

        .nav-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .nav-section:hover {
            transform: translateY(-5px);
        }

        .nav-section h2 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
            color: #00ffcc;
        }

        /* Your main section interaction buttons */
        .action-btn {
            background: linear-gradient(135deg, #00ffcc, #00b3ff);
            border: none;
            color: #0f0f1b;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            transform: scale(1.02);
        }

        /* Special style for horror button to fit context */
        .horror-trigger-btn {
            background: linear-gradient(135deg, #ff3333, #990000);
            color: #fff;
        }
        .horror-trigger-btn:hover {
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
        }
