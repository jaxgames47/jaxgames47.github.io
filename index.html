<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jax Games | Next-Gen</title>
    <style>
        /* -------------------------------------------------------------
           DYNAMIC THEMES & DESIGN SYSTEM CONSTANTS
        ------------------------------------------------------------- */
        :root {
            /* Default: Crimson Neo */
            --bg-main: #140504;
            --bg-surface: #220a08;
            --bg-card: #2e0e0b;
            --neon-accent: #FF0800;
            --text-main: #ffebee;
            --text-muted: rgba(255, 235, 238, 0.6);
            --border-color: #540400;
            --ultra-timing: cubic-bezier(0.25, 1, 0.3, 1);
        }

        [data-theme="midnight"] {
            --bg-main: #0B0F19;
            --bg-surface: #111827;
            --bg-card: #1F2937;
            --neon-accent: #3B82F6;
            --text-main: #F3F4F6;
            --text-muted: rgba(243, 244, 246, 0.6);
            --border-color: #1E3A8A;
        }

        [data-theme="cyber"] {
            --bg-main: #0A0A0C;
            --bg-surface: #121216;
            --bg-card: #1A1A22;
            --neon-accent: #00FFCC;
            --text-main: #E2E8F0;
            --text-muted: rgba(226, 232, 240, 0.6);
            --border-color: #004D40;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            perspective: 1200px;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .page-wrapper {
            transition: transform 0.8s var(--ultra-timing), filter 0.8s var(--ultra-timing);
            will-change: transform, filter;
            width: 100%;
            min-height: 100vh;
            transform-style: preserve-3d;
        }

        body.is-cinematic-loading .page-wrapper {
            filter: blur(15px) brightness(0.3);
            transform: scale(0.92) translateZ(-100px);
            pointer-events: none;
        }

        /* -------------------------------------------------------------
           HEADER, NAVIGATION & CONTROLS
        ------------------------------------------------------------- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
            max-width: 1400px;
            margin: 0 auto;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            user-select: none;
            transition: transform 0.3s ease;
        }
        .logo:hover {
            transform: skewX(-5deg) scale(1.03);
        }

        .jax { color: #ffffff; }
        .games-cyan { 
            color: var(--neon-accent); 
            text-shadow: 0 0 20px var(--neon-accent);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .theme-select {
            background: var(--bg-surface);
            color: var(--text-main);
            border: 2px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }

        .theme-select:focus {
            border-color: var(--neon-accent);
            box-shadow: 0 0 15px var(--neon-accent);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 40px 50px 40px;
            text-align: center;
        }

        h1.section-title {
            font-size: 3rem;
            margin-bottom: 30px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            color: #ffffff;
        }
        
        h1.section-title::after {
            content: '';
            position: absolute;
            left: 10%;
            bottom: -15px;
            width: 80%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--neon-accent), transparent);
            box-shadow: 0 0 10px var(--neon-accent);
        }

        /* -------------------------------------------------------------
           SEARCH INTERFACE
        ------------------------------------------------------------- */
        .search-container {
            margin-bottom: 60px;
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 500px;
        }

        .search-bar {
            width: 100%;
            padding: 15px 25px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            border: 3px solid var(--border-color);
            background-color: var(--bg-surface);
            color: #ffffff;
            outline: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.4s var(--ultra-timing);
        }

        .search-bar::placeholder {
            color: var(--text-muted);
        }

        .search-bar:focus {
            border-color: var(--neon-accent);
            box-shadow: 0 0 25px var(--neon-accent), 0 10px 20px rgba(0,0,0,0.4);
            transform: scale(1.02);
        }

        /* -------------------------------------------------------------
           CLEAN FLUID GRID ARCHITECTURE & FAVORITES SYSTEM
        ------------------------------------------------------------- */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 30px;
            justify-items: center;
            transform-style: preserve-3d;
        }

        .game-link {
            text-decoration: none;
            display: block;
            outline: none;
            perspective: 1000px;
            width: 100%;
            max-width: 220px;
            position: relative;
        }

        .game-button {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: var(--bg-card);
            border: 3px solid var(--border-color);
            border-radius: 24px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            transform-style: preserve-3d;
            transform: translateZ(0);
            transition: transform 0.5s var(--ultra-timing), border-color 0.5s var(--ultra-timing), box-shadow 0.5s var(--ultra-timing);
            will-change: transform, box-shadow, border-color;
        }

        .game-button img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translateZ(0) scale(1.01);
            transition: transform 0.6s var(--ultra-timing);
        }

        .favorite-heart-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }
        .favorite-heart-btn:hover {
            transform: scale(1.15);
            border-color: #ff3366;
            color: #ff3366;
        }
        .favorite-heart-btn.is-active {
            color: #ff3366;
            border-color: #ff3366;
            background: rgba(0, 0, 0, 0.85);
            text-shadow: 0 0 8px #ff3366;
        }

        .game-link:hover .game-button {
            border-color: var(--neon-accent);
            transform: translateY(-10px) rotateX(10deg) rotateY(-5deg) translateZ(20px);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6), 0 0 25px var(--neon-accent);
        }

        .game-link:hover .game-button img {
            transform: translateZ(15px) scale(1.1);
        }

        .game-link.is-hidden {
            display: none !important;
        }

        /* -------------------------------------------------------------
           INTEGRATED CHAT AND SOCIAL NETWORK PANEL
        ------------------------------------------------------------- */
        .social-dashboard-section {
            max-width: 1000px;
            margin: 60px auto 0 auto;
            background: var(--bg-surface);
            border: 3px solid var(--border-color);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .dashboard-tabs {
            display: flex;
            background: var(--bg-card);
            border-bottom: 2px solid var(--border-color);
        }

        .dashboard-tab-btn {
            flex: 1;
            padding: 18px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dashboard-tab-btn.active {
            color: var(--neon-accent);
            background: var(--bg-surface);
            box-shadow: inset 0 -4px 0 var(--neon-accent);
        }

        .dashboard-tab-content {
            padding: 30px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .friends-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .social-search-bar {
            display: flex;
            gap: 15px;
            max-width: 600px;
            margin: 0 auto 10px auto;
            width: 100%;
        }

        .social-search-bar input {
            flex: 1;
            padding: 12px 20px;
            background: var(--bg-main);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            outline: none;
            font-size: 1rem;
        }

        .social-search-bar input:focus {
            border-color: var(--neon-accent);
        }

        .social-search-bar button {
            padding: 12px 25px;
            background: var(--neon-accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .friends-flex-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .friend-dashboard-card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .friend-info-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .friend-name-tag {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .friend-status-activity {
            font-size: 0.9rem;
            color: var(--neon-accent);
            font-weight: 600;
        }

        .chat-action-btn {
            padding: 10px 20px;
            background: var(--bg-main);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .chat-action-btn:hover {
            border-color: var(--neon-accent);
            background: rgba(255, 8, 0, 0.1);
        }

        /* REAL-TIME HUB CHAT WINDOW INTERFACE */
        .chat-pane-layout {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            height: 380px;
        }

        .chat-history-box {
            flex-grow: 1;
            background: var(--bg-main);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .chat-message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .chat-message-bubble.incoming {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            align-self: flex-start;
            border-top-left-radius: 4px;
        }

        .chat-message-bubble.outgoing {
            background: var(--neon-accent);
            color: #fff;
            align-self: flex-end;
            border-top-right-radius: 4px;
        }

        .chat-meta-header {
            font-size: 0.8rem;
            font-weight: 800;
            margin-bottom: 4px;
            opacity: 0.8;
            display: block;
        }

        .chat-input-bar {
            display: flex;
            gap: 12px;
        }

        .chat-input-bar input {
            flex: 1;
            padding: 14px 20px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            outline: none;
            font-size: 1rem;
        }

        .chat-input-bar input:focus {
            border-color: var(--neon-accent);
        }

        .chat-send-btn {
            padding: 0 25px;
            background: var(--neon-accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        /* Horror Overlay Layout */
        .horror-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:center;z-index:99999}
        .horror-box{width:420px;max-width:90%;background:var(--bg-surface);border:3px solid var(--neon-accent);border-radius:20px;padding:25px;text-align:center}
        #pinInput{width:100%;padding:15px;font-size:24px;text-align:center;margin:10px 0}
        .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
        .pinpad button{padding:15px}
        #horrorGames{display:none;margin-top:20px}
        #horrorGames .game-grid{grid-template-columns:repeat(2,1fr)}

        /* Account Overlays System Layout */
        .auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99998;
        }
        .auth-modal-box {
            width: 380px;
            background: var(--bg-surface);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            position: relative;
        }
        .auth-modal-box h3 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }
        .auth-modal-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            outline: none;
        }
        .auth-modal-box input:focus {
            border-color: var(--neon-accent);
        }
        .auth-action-btn {
            width: 100%;
            padding: 12px;
            background: var(--neon-accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .auth-switch-link {
            font-size: 0.85rem;
            margin-top: 15px;
            color: var(--text-muted);
        }
        .auth-switch-link span {
            color: var(--neon-accent);
            cursor: pointer;
            text-decoration: underline;
        }
        
        .name-setup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 5, 5, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100000;
        }

        .auth-gateway-loading-screen {
            position: absolute;
            inset: 0;
            background: var(--bg-surface);
            border-radius: 20px;
            z-index: 50;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .gateway-timer-display {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 10px;
            font-family: monospace;
        }
    </style>
</head>

                <a href="https://jaxgames47.github.io/subwaysurfers/" class="game-link" data-title="idk">
                    <div class="game-button"><img src="subway-surfers-logo.png" alt="Subway Surfers"></div>
                </a>
            </div>
        </div>
    </div>
            <div class="social-dashboard-section">
                <div class="dashboard-tabs">
                    <button class="dashboard-tab-btn active" id="dashFriendsTabHead" onclick="toggleDashboardTab('friends')">Network Friends</button>
                    <button class="dashboard-tab-btn" id="dashChatTabHead" onclick="toggleDashboardTab('chat')">Live Local Chat 💬</button>
                </div>
                
                <div class="dashboard-tab-content" id="dashFriendsPane">
                    <div class="friends-layout">
                        <div class="social-search-bar">
                            <input type="text" id="addFriendUsernameInput" placeholder="Enter target username to link...">
                            <button onclick="handleAddFriendSubmit()">+ Add Friend</button>
                        </div>
                        <div class="friends-flex-list" id="dashboardFriendsRenderBox">
                            </div>
                    </div>
                </div>

                <div class="dashboard-tab-content" id="dashChatPane" style="display:none;">
                    <div class="chat-pane-layout" id="chatActiveWindowArea">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <div class="cinematic-portal" id="cinematicPortal"></div>

    <div class="horror-overlay" id="horrorOverlay">
        <div class="horror-box">
            <div id="pinSection">
                <h2>🔒 Horror Games</h2>
                <input id="pinInput" type="password" readonly>
                <div class="pinpad">
                    <button onclick="pinPress('1')">1</button><button onclick="pinPress('2')">2</button><button onclick="pinPress('3')">3</button>
                    <button onclick="pinPress('4')">4</button><button onclick="pinPress('5')">5</button><button onclick="pinPress('6')">6</button>
                    <button onclick="pinPress('7')">7</button><button onclick="pinPress('8')">8</button><button onclick="pinPress('9')">9</button>
                    <button onclick="clearPin()">C</button><button onclick="pinPress('0')">0</button><button onclick="closeHorror()">✕</button>
                </div>
            </div>
            <div id="horrorGames">
                <h2>Horror Games</h2>
                <div class="game-grid">
                    <a href="https://jaxgames47.github.io/granny/" class="game-link"><div class="game-button"><img src="Granny.png"></div></a>
                    <a href="https://jaxgames47.github.io/thebackrooms/" class="game-link"><div class="game-button"><img src="backrooms.png"></div></a>
                </div>
            </div>
        </div>
    </div>

    <div class="auth-overlay" id="authOverlay">
        <div class="auth-modal-box" id="loginFormWindow">
            <div class="auth-gateway-loading-screen" id="authGatewayLoader">
                <div class="spinner"></div>
                <div class="loading-text" id="gatewayStatusMessage">Verifying Identity...</div>
                <div class="gateway-timer-display" id="gatewayTimer">Remaining: --s</div>
            </div>
            <div style="text-align: right; margin-bottom: 5px;"><span style="cursor:pointer;" onclick="closeAuthSystem()">✕</span></div>
            <h3 id="authTitle">Sign In</h3>
            <input type="email" id="authEmail" placeholder="Email Address">
            <input type="password" id="authPassword" placeholder="Password">
            <button class="auth-action-btn" id="authSubmitBtn" onclick="submitAuthData()">Submit</button>
            <div class="auth-switch-link" id="authSwitchFooter">Don't have an account? <span onclick="toggleAuthMode(true)">Create Account</span></div>
        </div>
    </div>

    <div class="name-setup-overlay" id="nameSetupOverlay">
        <div class="auth-modal-box">
            <h3>Choose a Display Name</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">This name allows other members to find you.</p>
            <input type="text" id="displayUniqueNameInput" placeholder="Username / Display Name...">
            <button class="auth-action-btn" onclick="saveChosenDisplayName()">Confirm Username</button>
        </div>
    </div>

<script>
        // -------------------------------------------------------------
        // STATE CORE & ACCOUNT FRAMEWORK CONFIGURATION
        // -------------------------------------------------------------
        let activeUser = JSON.parse(localStorage.getItem('jax_loggedInUser')) || null;
        let registrationMode = false;
        let currentActiveTab = 'friends';
        let targetedChatPartnerEmail = null; // Keeps track of active conversation scope

        function openAuthSystem() {
            if (activeUser) {
                updateActiveUserGameStatus("Offline");
                localStorage.removeItem('jax_loggedInUser');
                activeUser = null;
                alert("Logged out successfully!");
                refreshAccountStatusUI();
                renderSocialSystemDashboard();
                return;
            }
            toggleAuthMode(false);
            document.getElementById('authOverlay').style.display = 'flex';
        }

        function closeAuthSystem() {
            document.getElementById('authOverlay').style.display = 'none';
        }

        function toggleAuthMode(isSignUp) {
            registrationMode = isSignUp;
            document.getElementById('authTitle').innerText = isSignUp ? "Create Account" : "Sign In";
            document.getElementById('authSwitchFooter').innerHTML = isSignUp ? 
                `Already registered? <span onclick="toggleAuthMode(false)">Sign In</span>` : 
                `Don't have an account? <span onclick="toggleAuthMode(true)">Create Account</span>`;
        }

        function submitAuthData() {
            const email = document.getElementById('authEmail').value.trim();
            const pass = document.getElementById('authPassword').value;
            if (!email || !pass) { alert("Please complete form credentials."); return; }

            let usersList = JSON.parse(localStorage.getItem('jax_registeredUsers')) || {};
            const chosenSeconds = Math.floor(Math.random() * (5 - 2 + 1)) + 2;
            
            const loader = document.getElementById('authGatewayLoader');
            loader.style.display = 'flex';
            
            setTimeout(() => {
                if (registrationMode) {
                    if (usersList[email]) { loader.style.display = 'none'; alert("Email already exists."); return; }
                    usersList[email] = { email: email, password: pass, username: "", currentStatus: "Browsing Hub" };
                    localStorage.setItem('jax_registeredUsers', JSON.stringify(usersList));
                    activeUser = usersList[email];
                    localStorage.setItem('jax_loggedInUser', JSON.stringify(activeUser));
                    closeAuthSystem();
                    checkUsernameLockState();
                } else {
                    if (usersList[email] && usersList[email].password === pass) {
                        activeUser = usersList[email];
                        activeUser.currentStatus = "Browsing Hub";
                        usersList[email].currentStatus = "Browsing Hub";
                        localStorage.setItem('jax_registeredUsers', JSON.stringify(usersList));
                        localStorage.setItem('jax_loggedInUser', JSON.stringify(activeUser));
                        closeAuthSystem();
                        checkUsernameLockState();
                    } else {
                        loader.style.display = 'none';
                        alert("Invalid credentials.");
                    }
                }
                loader.style.display = 'none';
                refreshAccountStatusUI();
            }, chosenSeconds * 1000);
        }

        function checkUsernameLockState() {
            if (activeUser && !activeUser.username) {
                document.getElementById('nameSetupOverlay').style.display = 'flex';
            } else {
                document.getElementById('nameSetupOverlay').style.display = 'none';
            }
            renderSocialSystemDashboard();
        }

        function saveChosenDisplayName() {
            const chosenName = document.getElementById('displayUniqueNameInput').value.trim();
            if (!chosenName || chosenName.length < 3) { alert("Username must be 3+ characters."); return; }

            let usersList = JSON.parse(localStorage.getItem('jax_registeredUsers')) || {};
            for (let userKey in usersList) {
                if (usersList[userKey].username && usersList[userKey].username.toLowerCase() === chosenName.toLowerCase()) {
                    alert("Username already taken!");
                    return;
                }
            }

            activeUser.username = chosenName;
            usersList[activeUser.email] = activeUser;
            localStorage.setItem('jax_registeredUsers', JSON.stringify(usersList));
            localStorage.setItem('jax_loggedInUser', JSON.stringify(activeUser));
            
            document.getElementById('nameSetupOverlay').style.display = 'none';
            refreshAccountStatusUI();
            renderSocialSystemDashboard();
        }

        function refreshAccountStatusUI() {
            const btn = document.getElementById('authHeaderBtn');
            btn.innerText = activeUser ? `Logout (${activeUser.username || "Pending"}) 👤` : "Sign In 👤";
        }

        function updateActiveUserGameStatus(statusText) {
            if (!activeUser) return;
            let usersList = JSON.parse(localStorage.getItem('jax_registeredUsers')) || {};
            if (usersList[activeUser.email]) {
                usersList[activeUser.email].currentStatus = statusText;
                localStorage.setItem('jax_registeredUsers', JSON.stringify(usersList));
            }
            activeUser.currentStatus = statusText;
            localStorage.setItem('jax_loggedInUser', JSON.stringify(activeUser));
        }

        // -------------------------------------------------------------
        // DYNAMIC CONTENT DASHBOARD TAB ARCHITECTURE
        // -------------------------------------------------------------
        function toggleDashboardTab(tabName) {
            currentActiveTab = tabName;
            document.getElementById('dashFriendsTabHead').classList.toggle('active', tabName === 'friends');
            document.getElementById('dashChatTabHead').classList.toggle('active', tabName === 'chat');
            document.getElementById('dashFriendsPane').style.display = tabName === 'friends' ? 'block' : 'none';
            document.getElementById('dashChatPane').style.display = tabName === 'chat' ? 'block' : 'none';
            renderSocialSystemDashboard();
        }

        function handleAddFriendSubmit() {
            if (!activeUser) { alert("Please log in to manage your network directory."); return; }
            const nameVal = document.getElementById('addFriendUsernameInput').value.trim();
            if (!nameVal) return;

            let usersList = JSON.parse(localStorage.getItem('jax_registeredUsers')) || {};
            let targetUser = null;
            for (let e in usersList) {
                if (usersList[e].username && usersList[e].username.toLowerCase() === nameVal.toLowerCase()) {
                    targetUser = usersList[e];
                    break;
                }
            }

            if (!targetUser) { alert("Targeted user display name not found."); return; }
            if (targetUser.email === activeUser.email) { alert("You can't add yourself."); return; }

            let friendsKey = `jax_friends_${activeUser.email}`;
            let currentFriends = JSON.parse(localStorage.getItem(friendsKey)) || [];
            if (currentFriends.some(f => f.email === targetUser.email)) { alert("User already added."); return; }

            currentFriends.push({ email: targetUser.email, username: targetUser.username });
            localStorage.setItem(friendsKey, JSON.stringify(currentFriends));

            // Auto reciprocate listing for easy testing inside simulation environments
            let targetFriendsKey = `jax_friends_${targetUser.email}`;
            let targetFriends = JSON.parse(localStorage.getItem(targetFriendsKey)) || [];
            if (!targetFriends.some(f => f.email === activeUser.email)) {
                targetFriends.push({ email: activeUser.email, username: activeUser.username });
                localStorage.setItem(targetFriendsKey, JSON.stringify(targetFriends));
            }

            document.getElementById('addFriendUsernameInput').value = '';
            renderSocialSystemDashboard();
        }

        function openDirectChatPane(friendEmail) {
            targetedChatPartnerEmail = friendEmail;
            toggleDashboardTab('chat');
        }

        function renderSocialSystemDashboard() {
            if (!activeUser) {
                document.getElementById('dashboardFriendsRenderBox').innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:20px;">Please Sign In to track your friends list activity.</div>`;
                document.getElementById('chatActiveWindowArea').innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:40px;">Please Sign In to access live chat systems.</div>`;
                return;
            }

            if (currentActiveTab === 'friends') {
                const box = document.getElementById('dashboardFriendsRenderBox');
                box.innerHTML = '';

                let currentFriends = JSON.parse(localStorage.getItem(`jax_friends_${activeUser.email}`)) || [];
                let registeredProfiles = JSON.parse(localStorage.getItem('jax_registeredUsers')) || {};

                if (currentFriends.length === 0) {
                    box.innerHTML = `<div style="text-align:center;color:var(--text-muted);font-size:0.95rem;padding:20px;">Your friends directory is empty. Add users by username above!</div>`;
                    return;
                }

                currentFriends.forEach(friend => {
                    const profile = registeredProfiles[friend.email] || { currentStatus: "Offline" };
                    const card = document.createElement('div');
                    card.className = 'friend-dashboard-card';
                    card.innerHTML = `
                        <div class="friend-info-block">
                            <span class="friend-name-tag">👤 ${friend.username}</span>
                            <span class="friend-status-activity">🎮 Activity: ${profile.currentStatus || 'Offline'}</span>
                        </div>
                        <div>
                            <button class="chat-action-btn" onclick="openDirectChatPane('${friend.email}')">💬 Chat</button>
                        </div>
                    `;
                    box.appendChild(card);
                });
            } else {
                // RENDER ACTIVE CHAT INTERFACE WINDOW
                const area = document.getElementById('chatActiveWindowArea');
                if (!targetedChatPartnerEmail) {
                    area.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:40px;">Select a contact from your Friends list tab to start chatting!</div>`;
                    return;
                }

                let registeredProfiles = JSON.parse(localStorage.getItem('jax_registeredUsers')) || {};
                let partnerProfile = registeredProfiles[targetedChatPartnerEmail] || { username: "User" };

                area.innerHTML = `
                    <div style="text-align:left; font-weight:bold; margin-bottom:10px; color:var(--neon-accent);">💬 Chatting with: ${partnerProfile.username}</div>
                    <div class="chat-history-box" id="chatMsgLogsContainer"></div>
                    <div class="chat-input-bar">
                        <input type="text" id="chatMessagePayloadInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') dispatchDirectTextMessage()">
                        <button class="chat-send-btn" onclick="dispatchDirectTextMessage()">Send</button>
                    </div>
                `;

                renderMessageLogBubbles();
            }
        }

        // -------------------------------------------------------------
        // WI-FI BROADCAST STORAGE ROUTINES LOGIC
        // -------------------------------------------------------------
        function getGlobalChatConversationKey(userA, userB) {
            // Generates a unique tracking token independent of who initiates the message line
            return [userA, userB].sort().join("_msgKey_");
        }

        function dispatchDirectTextMessage() {
            const input = document.getElementById('chatMessagePayloadInput');
            const messageText = input.value.trim();
            if (!messageText || !targetedChatPartnerEmail || !activeUser) return;

            const conversationToken = getGlobalChatConversationKey(activeUser.email, targetedChatPartnerEmail);
            let messageLog = JSON.parse(localStorage.getItem(`jax_chatlog_${conversationToken}`)) || [];

            messageLog.push({
                senderEmail: activeUser.email,
                senderName: activeUser.username,
                text: messageText,
                timestamp: Date.now()
            });

            localStorage.setItem(`jax_chatlog_${conversationToken}`, JSON.stringify(messageLog));
            input.value = '';
            renderMessageLogBubbles();

            // Trigger a dummy storage event so it updates other matching frames instantly
            localStorage.setItem('jax_chat_sync_ping', Date.now());
        }

        function renderMessageLogBubbles() {
            const container = document.getElementById('chatMsgLogsContainer');
            if (!container || !targetedChatPartnerEmail || !activeUser) return;

            const conversationToken = getGlobalChatConversationKey(activeUser.email, targetedChatPartnerEmail);
            let messageLog = JSON.parse(localStorage.getItem(`jax_chatlog_${conversationToken}`)) || [];

            container.innerHTML = '';
            
            if(messageLog.length === 0) {
                container.innerHTML = `<div style="text-align:center;color:var(--text-muted);font-size:0.85rem;margin:auto 0;">No messages yet. Say hello! 👋</div>`;
                return;
            }

            messageLog.forEach(msg => {
                const bubble = document.createElement('div');
                const isOutgoing = msg.senderEmail === activeUser.email;
                bubble.className = `chat-message-bubble ${isOutgoing ? 'outgoing' : 'incoming'}`;
                
                bubble.innerHTML = `
                    <span class="chat-meta-header">${isOutgoing ? 'You' : msg.senderName}</span>
                    <div>${escapeHtmlContent(msg.text)}</div>
                `;
                container.appendChild(bubble);
            });

            container.scrollTop = container.scrollHeight;
        }

        function escapeHtmlContent(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Catch incoming events broadcasted from alternate tabs on the same local network
        window.addEventListener('storage', (e) => {
            if (currentActiveTab === 'chat' && (e.key === 'jax_chat_sync_ping' || e.key.startsWith('jax_chatlog_'))) {
                renderMessageLogBubbles();
            }
            if (e.key === 'jax_registeredUsers') {
                renderSocialSystemDashboard();
            }
        });

        // Periodic background poll updates for statuses 
        setInterval(() => {
            if (activeUser && currentActiveTab === 'friends') {
                renderSocialSystemDashboard();
            }
        }, 3000);

        // -------------------------------------------------------------
        // PERSISTENT FAVORITE GAMES ENGINE ALGORITHM
        // -------------------------------------------------------------
        function getFavoriteArray() {
            if (!activeUser) return JSON.parse(localStorage.getItem('jax_guest_favorites')) || [];
            return JSON.parse(localStorage.getItem(`jax_favorites_${activeUser.email}`)) || [];
        }

        function saveFavoriteArray(arr) {
            if (!activeUser) {
                localStorage.setItem('jax_guest_favorites', JSON.stringify(arr));
            } else {
                localStorage.setItem(`jax_favorites_${activeUser.email}`, JSON.stringify(arr));
            }
            applyFavoritesOrderingSort();
        }

        function toggleFavoriteGame(event, gameId) {
            event.preventDefault();
            event.stopPropagation();
            let favorites = getFavoriteArray();
            if (favorites.includes(gameId)) {
                favorites = favorites.filter(id => id !== gameId);
            } else {
                favorites.push(gameId);
            }
            saveFavoriteArray(favorites);
        }

        function applyFavoritesOrderingSort() {
            const grid = document.getElementById('mainGameGrid');
            const games = Array.from(grid.querySelectorAll('.game-link'));
            const favorites = getFavoriteArray();

            games.forEach(game => {
                const heartBtn = game.querySelector('.favorite-heart-btn');
                if (favorites.includes(game.id)) {
                    heartBtn.classList.add('is-active');
                    game.dataset.favOrder = "1";
                } else {
                    heartBtn.classList.remove('is-active');
                    game.dataset.favOrder = "2";
                }
            });

            games.sort((a, b) => parseInt(a.dataset.favOrder) - parseInt(b.dataset.favOrder));
            games.forEach(game => grid.appendChild(game));
        }

        // -------------------------------------------------------------
        // CORE HANDLERS HOOKS
        // -------------------------------------------------------------
        const themeSelect = document.getElementById('themeSelect');
        themeSelect.addEventListener('change', (e) => {
            document.documentElement.setAttribute('data-theme', e.target.value);
        });

        const searchInput = document.getElementById('gameSearch');
        const gameLinks = document.querySelectorAll('.game-link');

        searchInput.addEventListener('input', function() {
            const filterText = this.value.toLowerCase().trim();
            if (filterText === 'jaxon secret games') { window.open('https://jaxonsecretgames.w3spaces.com/', '_blank'); this.value = ''; return; } 
            if (filterText === 'duck proxy') { window.open('https://duckproxy.onrender.com/', '_blank'); this.value = ''; return; } 
            if (filterText === 'unblocked gn math') { window.open('https://jaxgames47.github.io/gn-math/', '_blank'); this.value = ''; return; }

            gameLinks.forEach(link => {
                const gameTitle = link.getAttribute('data-title').toLowerCase();
                link.classList.toggle('is-hidden', !gameTitle.includes(filterText));
            });
        });

        gameLinks.forEach(link => {
            const button = link.querySelector('.game-button');
            if (!button) return;
            link.addEventListener('mousemove', (e) => {
                const rect = button.getBoundingClientRect();
                const x = e.clientX - rect.left - (rect.width / 2);
                const y = e.clientY - rect.top - (rect.height / 2);
                button.style.transform = `translateY(-10px) rotateX(${(y / (rect.height / 2)) * -12}deg) rotateY(${(x / (rect.width / 2)) * 12}deg) translateZ(20px)`;
            });
            link.addEventListener('mouseleave', () => { button.style.transform = ''; });

            link.addEventListener('click', function(e) {
                if (e.target.classList.contains('favorite-heart-btn')) return;
                e.preventDefault();
                const img = button.querySelector('img');
                const targetUrl = this.href;
                const portal = document.getElementById('cinematicPortal');
                const rect = button.getBoundingClientRect();

                const parsedTitle = this.getAttribute('data-title').split(' ')[0].toUpperCase();
                updateActiveUserGameStatus(parsedTitle);

                const clone = document.createElement('div');
                clone.className = 'focus-clone';
                clone.style.top = `${rect.top}px`;
                clone.style.left = `${rect.left}px`;
                clone.innerHTML = `
                    <div class="portal-overlay">
                        <div class="spinner"></div>
                        <div class="loading-text">Loading</div>
                    </div>
                    <img src="${img.getAttribute('src')}" alt="Assets">
                `;

                portal.appendChild(clone);
                button.style.opacity = '0';
                document.body.classList.add('is-cinematic-loading');

                requestAnimationFrame(() => {
                    clone.style.top = `${window.innerHeight / 2 - rect.height / 2}px`;
                    clone.style.left = `${window.innerWidth / 2 - rect.width / 2}px`;
                    clone.classList.add('is-zoomed');
                });

                setTimeout(() => { window.location.href = targetUrl; }, 1400);
            });
        });
    
        const horrorOverlay=document.getElementById('horrorOverlay'),horrorBtn=document.getElementById('horrorBtn'),pinInput=document.getElementById('pinInput'),pinSection=document.getElementById('pinSection'),horrorGames=document.getElementById('horrorGames');let currentPin='';
        horrorBtn.onclick=()=>{currentPin='';pinInput.value='';pinSection.style.display='block';horrorGames.style.display='none';horrorOverlay.style.display='flex';}
        function pinPress(n){if(currentPin.length>=4)return;currentPin+=n;pinInput.value='*'.repeat(currentPin.length);if(currentPin.length===4){if(currentPin==='0311'){pinSection.style.display='none';horrorGames.style.display='block';}else{alert('Incorrect PIN');clearPin();}}}
        function clearPin(){currentPin='';pinInput.value='';}
        function closeHorror(){horrorOverlay.style.display='none';}

        refreshAccountStatusUI();
        checkUsernameLockState();
        applyFavoritesOrderingSort();
</script>
</body>
</html>
