<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jax Games | Next-Gen</title>
    <style>
        /* -------------------------------------------------------------
           DYNAMIC THEMES & DESIGN SYSTEM CONSTANTS
        ------------------------------------------------------------- */
        :root {
            /* Default: Crimson Neo */
            --bg-main: #140504;
            --bg-surface: #220a08;
            --bg-card: #2e0e0b;
            --neon-accent: #FF0800;
            --text-main: #ffebee;
            --text-muted: rgba(255, 235, 238, 0.6);
            --border-color: #540400;
            --ultra-timing: cubic-bezier(0.25, 1, 0.3, 1);
        }

        [data-theme="midnight"] {
            --bg-main: #0B0F19;
            --bg-surface: #111827;
            --bg-card: #1F2937;
            --neon-accent: #3B82F6;
            --text-main: #F3F4F6;
            --text-muted: rgba(243, 244, 246, 0.6);
            --border-color: #1E3A8A;
        }

        [data-theme="cyber"] {
            --bg-main: #0A0A0C;
            --bg-surface: #121216;
            --bg-card: #1A1A22;
            --neon-accent: #00FFCC;
            --text-main: #E2E8F0;
            --text-muted: rgba(226, 232, 240, 0.6);
            --border-color: #004D40;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            perspective: 1200px;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .page-wrapper {
            transition: transform 0.8s var(--ultra-timing), filter 0.8s var(--ultra-timing);
            will-change: transform, filter;
            width: 100%;
            min-height: 100vh;
            transform-style: preserve-3d;
        }

        body.is-cinematic-loading .page-wrapper {
            filter: blur(15px) brightness(0.3);
            transform: scale(0.92) translateZ(-100px);
            pointer-events: none;
        }

        /* -------------------------------------------------------------
           HEADER, NAVIGATION & CONTROLS
        ------------------------------------------------------------- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            user-select: none;
            transition: transform 0.3s ease;
        }
        .logo:hover {
            transform: skewX(-5deg) scale(1.03);
        }

        .jax { color: #ffffff; }
        .games-cyan { 
            color: var(--neon-accent); 
            text-shadow: 0 0 20px var(--neon-accent);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .theme-select {
            background: var(--bg-surface);
            color: var(--text-main);
            border: 2px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }

        .theme-select:focus {
            border-color: var(--neon-accent);
            box-shadow: 0 0 15px var(--neon-accent);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 40px 100px 40px;
            text-align: center;
        }

        h1.section-title {
            font-size: 3rem;
            margin-bottom: 30px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            color: #ffffff;
        }
        
        h1.section-title::after {
            content: '';
            position: absolute;
            left: 10%;
            bottom: -15px;
            width: 80%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--neon-accent), transparent);
            box-shadow: 0 0 10px var(--neon-accent);
        }

        /* -------------------------------------------------------------
           SEARCH INTERFACE
        ------------------------------------------------------------- */
        .search-container {
            margin-bottom: 60px;
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 500px;
        }

        .search-bar {
            width: 100%;
            padding: 15px 25px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            border: 3px solid var(--border-color);
            background-color: var(--bg-surface);
            color: #ffffff;
            outline: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.4s var(--ultra-timing);
        }

        .search-bar::placeholder {
            color: var(--text-muted);
        }

        .search-bar:focus {
            border-color: var(--neon-accent);
            box-shadow: 0 0 25px var(--neon-accent), 0 10px 20px rgba(0,0,0,0.4);
            transform: scale(1.02);
        }

        /* -------------------------------------------------------------
           CLEAN FLUID GRID ARCHITECTURE
        ------------------------------------------------------------- */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 30px;
            justify-items: center;
            transform-style: preserve-3d;
        }

        .game-link {
            text-decoration: none;
            display: block;
            outline: none;
            perspective: 1000px;
            width: 100%;
            max-width: 220px;
        }

        .game-button {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: var(--bg-card);
            border: 3px solid var(--border-color);
            border-radius: 24px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            transform-style: preserve-3d;
            transform: translateZ(0);
            transition: transform 0.5s var(--ultra-timing), border-color 0.5s var(--ultra-timing), box-shadow 0.5s var(--ultra-timing);
            will-change: transform, box-shadow, border-color;
        }

        .game-button img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translateZ(0) scale(1.01);
            transition: transform 0.6s var(--ultra-timing);
        }

        /* Hover States */
        .game-link:hover .game-button {
            border-color: var(--neon-accent);
            transform: translateY(-10px) rotateX(10deg) rotateY(-5deg) translateZ(20px);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6), 0 0 25px var(--neon-accent);
        }

        .game-link:hover .game-button img {
            transform: translateZ(15px) scale(1.1);
        }

        .game-link.is-hidden {
            display: none !important;
        }

        /* -------------------------------------------------------------
           CINEMATIC ANIMATION OVERLAYS
        ------------------------------------------------------------- */
        .cinematic-portal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .focus-clone {
            position: absolute;
            width: 210px;
            height: 210px;
            background-color: var(--bg-card);
            border: 4px solid #ffffff;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(255,255,255,0.4);
            transition: top 0.7s var(--ultra-timing), left 0.7s var(--ultra-timing), transform 0.7s var(--ultra-timing), box-shadow 0.7s var(--ultra-timing);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .focus-clone.is-zoomed {
            transform: scale(1.8) rotateZ(360deg);
            box-shadow: 0 0 100px var(--neon-accent), 0 30px 80px rgba(0,0,0,0.8);
        }

        .focus-clone img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(2px) brightness(0.6);
        }

        .portal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 5, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--neon-accent);
            border-radius: 50%;
            animation: hyperSpin 0.6s linear infinite;
            margin-bottom: 15px;
        }

        .loading-text {
            color: var(--neon-accent);
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes hyperSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* -------------------------------------------------------------
           MODERN UTILITY CAPABILITIES (AI CHAT & CALCULATOR)
        ------------------------------------------------------------- */
        /* Widgets Shared Style */
        .utility-widget {
            position: fixed;
            bottom: 30px;
            z-index: 5000;
            display: flex;
            flex-direction: column;
        }

        .widget-trigger {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: var(--bg-surface);
            border: 3px solid var(--border-color);
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .widget-trigger:hover {
            transform: scale(1.1);
            border-color: var(--neon-accent);
            box-shadow: 0 0 20px var(--neon-accent);
        }

        .widget-panel {
            position: absolute;
            bottom: 70px;
            width: 320px;
            background: var(--bg-surface);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: paneOpen 0.4s var(--ultra-timing);
        }

        @keyframes paneOpen {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Left Side: AI Assistant */
        .ai-assistant-wrapper { left: 30px; }
        .ai-panel { left: 0; height: 400px; }
        .ai-header {
            background: var(--bg-card);
            padding: 15px;
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }
        .ai-chat-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.9rem;
        }
        .chat-msg {
            padding: 8px 12px;
            border-radius: 14px;
            max-width: 85%;
        }
        .chat-msg.bot { background: var(--bg-card); align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-msg.user { background: var(--neon-accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        
        .ai-input-area {
            display: flex;
            padding: 10px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
        }
        .ai-input-area input {
            flex: 1;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 20px;
            color: white;
            outline: none;
        }
        .ai-input-area button {
            background: transparent;
            border: none;
            color: var(--neon-accent);
            padding: 0 10px;
            cursor: pointer;
            font-weight: 700;
        }

        /* Right Side: Calculator */
        .calculator-wrapper { right: 30px; }
        .calc-panel { right: 0; width: 280px; }
        .calc-screen {
            background: #000;
            color: #00FFCC;
            font-family: monospace;
            text-align: right;
            padding: 20px;
            font-size: 1.8rem;
            min-height: 70px;
            word-wrap: break-word;
        }
        .calc-header-nav {
            background: var(--bg-card);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border-color);
        }
        .calc-back-btn {
            cursor: pointer;
            color: var(--neon-accent);
            font-weight: bold;
        }
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: var(--border-color);
        }
        .calc-grid button {
            background: var(--bg-card);
            border: none;
            color: var(--text-main);
            padding: 18px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .calc-grid button:hover { background: var(--bg-surface); }
        .calc-grid button.op { color: var(--neon-accent); }
    </style>
</head>

    <script>
        // 1. DYNAMIC THEME SELECTOR ENGINE
        const themeSelect = document.getElementById('themeSelect');
        themeSelect.addEventListener('change', (e) => {
            document.documentElement.setAttribute('data-theme', e.target.value);
        });

        // 2. REAL-TIME SEARCH & FIXED SECRET CODE SYSTEM
        const searchInput = document.getElementById('gameSearch');
        const gameLinks = document.querySelectorAll('.game-link');

        searchInput.addEventListener('input', function() {
            const filterText = this.value.toLowerCase().trim();

            if (filterText === 'jaxon secret games') {
                window.open('https://jaxonsecretgames.w3spaces.com/', '_blank');
                this.value = '';
                return;
            } 
            if (filterText === 'duck proxy') {
                window.open('https://duckproxy.onrender.com/', '_blank');
                this.value = '';
                return;
            } 
            if (filterText === 'unblocked gn math') {
                window.open('https://jaxgames47.github.io/gn-math/', '_blank');
                this.value = '';
                return;
            }

            gameLinks.forEach(link => {
                const gameTitle = link.getAttribute('data-title').toLowerCase();
                if (gameTitle.includes(filterText)) {
                    link.classList.remove('is-hidden');
                } else {
                    link.classList.add('is-hidden');
                }
            });
        });

        // 3. SEAMLESS INTERFACE WIDGET TOGGLES
        function toggleWidget(id) {
            const panel = document.getElementById(id);
            panel.style.display = (panel.style.display === 'flex') ? 'none' : 'flex';
        }
        document.getElementById('aiTrigger').addEventListener('click', () => toggleWidget('aiPanel'));
        document.getElementById('calcTrigger').addEventListener('click', () => toggleWidget('calcPanel'));

        // 4. INTELLIGENT COMPANION BOT DYNAMICS
        const aiInput = document.getElementById('aiInput');
        const aiSendBtn = document.getElementById('aiSendBtn');
        const aiChatBody = document.getElementById('aiChatBody');

        function appendMessage(text, sender) {
            const el = document.createElement('div');
            el.className = `chat-msg ${sender}`;
            el.innerText = text;
            aiChatBody.appendChild(el);
            aiChatBody.scrollTop = aiChatBody.scrollHeight;
        }

        aiSendBtn.addEventListener('click', () => {
            const query = aiInput.value.trim();
            if(!query) return;
            appendMessage(query, 'user');
            aiInput.value = '';

            setTimeout(() => {
                let lower = query.toLowerCase();
                if(lower.includes('hello') || lower.includes('hi')) {
                    appendMessage("Greetings player! Find any clean high scores today?", 'bot');
                } else if(lower.includes('game') || lower.includes('best')) {
                    appendMessage("All systems are structural here. Minecraft Pocket Edition or Geometry Dash Lite are classic alternatives!", 'bot');
                } else {
                    appendMessage("I am fully running online alongside your local setup. Use the workspace filter search bar to slice down titles quickly!", 'bot');
                }
            }, 600);
        });

        // 5. HIGH ACCURACY MATH CALCULATOR MODULE
        let calcExpr = '';
        const calcScreen = document.getElementById('calcScreen');
        function pressCalc(val) {
            if(val === 'C') {
                calcExpr = '';
                calcScreen.innerText = '0';
            } else if(val === '=') {
                try {
                    if(!calcExpr) return;
                    // Safely evaluate standard mathematical characters
                    let result = Function('"use strict";return (' + calcExpr + ')')();
                    calcScreen.innerText = result;
                    calcExpr = String(result);
                } catch(e) {
                    calcScreen.innerText = 'Error';
                    calcExpr = '';
                }
            } else {
                if(calcScreen.innerText === '0' && !isNaN(val)) calcExpr = '';
                calcExpr += val;
                calcScreen.innerText = calcExpr;
            }
        }

        // 6. DYNAMIC MOUSE TILT ENGINE
        gameLinks.forEach(link => {
            const button = link.querySelector('.game-button');
            link.addEventListener('mousemove', (e) => {
                const rect = button.getBoundingClientRect();
                const x = e.clientX - rect.left - (rect.width / 2);
                const y = e.clientY - rect.top - (rect.height / 2);
                const tiltX = (y / (rect.height / 2)) * -12;
                const tiltY = (x / (rect.width / 2)) * 12;
                button.style.transform = `translateY(-10px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) translateZ(20px)`;
            });
            link.addEventListener('mouseleave', () => { button.style.transform = ''; });

            // 7. CINEMATIC SCENIC PORTAL DISPATCH
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const img = button.querySelector('img');
                const targetUrl = this.href;
                const portal = document.getElementById('cinematicPortal');
                const rect = button.getBoundingClientRect();

                const clone = document.createElement('div');
                clone.className = 'focus-clone';
                clone.style.top = `${rect.top}px`;
                clone.style.left = `${rect.left}px`;
                clone.innerHTML = `
                    <div class="portal-overlay">
                        <div class="spinner"></div>
                        <div class="loading-text">Loading</div>
                    </div>
                    <img src="${img.getAttribute('src')}" alt="Loading Assets">
                `;

                portal.appendChild(clone);
                button.style.opacity = '0';
                document.body.classList.add('is-cinematic-loading');

                requestAnimationFrame(() => {
                    const centerX = window.innerWidth / 2 - rect.width / 2;
                    const centerY = window.innerHeight / 2 - rect.height / 2;
                    clone.style.top = `${centerY}px`;
                    clone.style.left = `${centerX}px`;
                    clone.classList.add('is-zoomed');
                });

                setTimeout(() => { window.location.href = targetUrl; }, 1400);
            });
        });
    </script>
</body>
</html>
