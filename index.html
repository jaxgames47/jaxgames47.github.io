<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Game Portal</title>
    <style>
        /* --- Global Reset & Base Styles --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #1a1a2e, #0f0f1b);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            letter-spacing: 2px;
        }

        /* --- Main Hub Buttons --- */
        .hub-container {
            display: flex;
            gap: 20px;
        }

        .hub-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .hub-btn:hover {
            background: rgba(0, 255, 204, 0.2);
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transform: translateY(-3px);
        }

        /* --- Floating Page Overlay (Modal) --- */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.85);
            backdrop-filter: blur(15px);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* --- Floating Window Content --- */
        .floating-window {
            background: rgba(20, 20, 35, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            position: relative;
            text-align: center;
            transform: scale(0.9);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            from { transform: scale(0.8); }
            to { transform: scale(1); }
        }

        /* --- Back / Close Button --- */
        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: transparent;
            border: none;
            color: #ff4a4a;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: #ff1a1a;
        }

        /* --- Calculator Layout (Simple Placeholder) --- */
        .calc-display {
            background: #000;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.5rem;
            text-align: right;
            margin-bottom: 15px;
            border: 1px solid #333;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .calc-grid button {
            background: #222;
            border: 1px solid #444;
            color: #white;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .calc-grid button:hover {
            background: #333;
        }

        /* --- Pin Pad Interface --- */
        .pin-display {
            background: #111;
            padding: 15px;
            font-size: 1.8rem;
            letter-spacing: 8px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #ff4a4a;
            color: #ff4a4a;
            height: 60px;
        }

        .pin-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 280px;
            margin: 0 auto;
        }

        .pin-grid button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 15px;
            font-size: 1.3rem;
            border-radius: 50%;
            aspect-ratio: 1;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pin-grid button:hover {
            background: rgba(255, 74, 74, 0.2);
            border-color: #ff4a4a;
        }

        /* --- Horror Game Links Page --- */
        .horror-links-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .horror-game-link {
            display: block;
            background: linear-gradient(135deg, #1b0000, #4a0000);
            border: 1px solid #ff3333;
            color: #fff;
            padding: 15px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(255, 0, 0, 0.1);
        }

        .horror-game-link:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            background: linear-gradient(135deg, #320000, #660000);
        }
    </style>
</head>
<body>

    <h1>ARCADE HUB</h1>

    <div class="hub-container">
        <button class="hub-btn" onclick="openModal('calcModal')">Calculator</button>
        <button class="hub-btn" onclick="openModal('pinModal')">Horror Games</button>
    </div>

    <div id="calcModal" class="overlay">
        <div class="floating-window">
            <button class="back-btn" onclick="closeModal('calcModal')">← Back</button>
            <h2 style="margin-top: 15px; margin-bottom: 15px;">Calculator</h2>
            <div class="calc-display">0</div>
            <div class="calc-grid">
                <button>7</button><button>8</button><button>9</button><button style="color: #00ffcc">/</button>
                <button>4</button><button>5</button><button>6</button><button style="color: #00ffcc">*</button>
                <button>1</button><button>2</button><button>3</button><button style="color: #00ffcc">-</button>
                <button>C</button><button>0</button><button>=</button><button style="color: #00ffcc">+</button>
            </div>
        </div>
    </div>

    <div id="pinModal" class="overlay">
        <div class="floating-window">
            <button class="back-btn" onclick="closeModal('pinModal')">← Cancel</button>
            <h2 style="margin-top: 15px; color: #ff4a4a;">RESTRICTED AREA</h2>
            <p style="font-size: 0.9rem; color: #888; margin-bottom: 15px;">Type in the secret code!</p>
            
            <div class="pin-display" id="pinDisplay"></div>
            
            <div class="pin-grid">
                <button onclick="pressPin('1')">1</button>
                <button onclick="pressPin('2')">2</button>
                <button onclick="pressPin('3')">3</button>
                <button onclick="pressPin('4')">4</button>
                <button onclick="pressPin('5')">5</button>
                <button onclick="pressPin('6')">6</button>
                <button onclick="pressPin('7')">7</button>
                <button onclick="pressPin('8')">8</button>
                <button onclick="pressPin('9')">9</button>
                <button onclick="clearPin()" style="color: #ff4a4a; font-size: 0.9rem;">CLR</button>
                <button onclick="pressPin('0')">0</button>
                <button onclick="submitPin()" style="color: #00ffcc; font-size: 0.9rem;">OK</button>
            </div>
        </div>
    </div>

    <div id="horrorModal" class="overlay">
        <div class="floating-window" style="border: 1px solid #ff4a4a;">
            <button class="back-btn" onclick="closeModal('horrorModal')">← Back</button>
            <h2 style="margin-top: 15px; color: #ff3333; text-shadow: 0 0 10px rgba(255, 0, 0, 0.4);">HORROR COLLECTION</h2>
            <p style="color: #aaa; margin-bottom: 20px;">Welcome to the dark side. Choose your game:</p>
            
            <div class="horror-links-list">
                <a href="https://jaxgames47.github.io/granny" target="_blank" class="horror-game-link">Granny</a>
                <a href="https://jaxgames47.github.io/fnaf1" target="_blank" class="horror-game-link">FNAF 1</a>
                <a href="https://jaxgames47.github.io/thebackrooms" target="_blank" class="horror-game-link">The Backrooms</a>
            </div>
        </div>
    </div>

    <script>
        // Open overlays
        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }

        // Close overlays
        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
            if (id === 'pinModal') {
                clearPin(); // Clear entered code if canceled
            }
        }

        // Pin Pad Logic
        const SECRET_CODE = "5468";
        let currentPin = "";
        const pinDisplay = document.getElementById('pinDisplay');

        function pressPin(num) {
            if (currentPin.length < 4) {
                currentPin += num;
                // Display asterisks instead of actual numbers for secrecy
                pinDisplay.innerText = "*".repeat(currentPin.length);
            }
        }

        function clearPin() {
            currentPin = "";
            pinDisplay.innerText = "";
        }

        function submitPin() {
            if (currentPin === SECRET_CODE) {
                // Correct pin entered!
                closeModal('pinModal');
                openModal('horrorModal');
                clearPin();
            } else {
                // Wrong pin entered
                pinDisplay.innerText = "WRONG";
                pinDisplay.style.color = "#ff1a1a";
                setTimeout(() => {
                    clearPin();
                    pinDisplay.style.color = "#ff4a4a";
                }, 1000);
            }
        }
    </script>
</body>
</html>
